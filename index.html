<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kala Kuteer — Portal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7A2233">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kala Kuteer">
<script src="https://js.sentry-cdn.com/91ea405529edf583d95899f89b385539.min.js" crossorigin="anonymous"></script>
<script>
/* Filter out the browser's generic cross-origin "Script error." reports — they carry
   no stack trace and no user impact (just noise from third-party CDN scripts). */
(function(){
  if(window.Sentry && typeof Sentry.onLoad==="function"){
    Sentry.onLoad(function(){
      try{
        Sentry.init({
          ignoreErrors:[ "Script error.", "Script error", "Non-Error promise rejection captured", /ResizeObserver loop/ ],
          beforeSend:function(event){
            try{
              var ex=event.exception && event.exception.values && event.exception.values[0];
              var msg=((ex && ex.value) || event.message || "").trim();
              if(/^script error\.?$/i.test(msg)) return null;                 // drop "Script error."
              var frames=ex && ex.stacktrace && ex.stacktrace.frames;
              if((!frames || !frames.length) && /script error/i.test(msg)) return null; // no stack + generic = noise
            }catch(e){}
            return event;
          }
        });
      }catch(e){}
    });
  }
})();
</script>
<style>
  :root{
    --navy:#16305A; --saffron:#F0A92B; --saffron-deep:#C9772A; --maroon:#7A2233; --maroon-deep:#5A1722; --teal:#7A2233; --teal-deep:#5A1722;
    --cream:#FBF6EC; --ink:#2B2018; --muted:#7C6F5F; --line:#E7DCC8; --soft:#F3EAD8;
    --good:#2E8B57; --warn:#C24A3B; --card:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;
    color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
  .hide{display:none!important}
  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .logincard{background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 16px 40px rgba(21,48,90,.14);padding:30px 28px;width:100%;max-width:380px;text-align:center}
  .logincard img{height:110px;width:auto;margin:0 auto 8px;display:block}
  .logincard h1{font-size:18px;color:var(--maroon);margin-bottom:2px}
  .logincard p.sub{font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .field{text-align:left;margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:#fffdf8}
  .field input:focus{outline:2px solid var(--teal);border-color:var(--teal)}
  .signin{width:100%;background:var(--teal);color:#fff;border:0;padding:13px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px}
  .signin:disabled{opacity:.6;cursor:default}
  .msg{font-size:12.5px;margin-top:12px;min-height:16px}
  .msg.err{color:var(--warn)} .msg.ok{color:var(--good)}
  .loginfoot{font-size:11px;color:var(--muted);margin-top:16px}
  .cfgwarn{background:#fbe7e3;color:var(--warn);border-radius:10px;padding:10px;font-size:12px;margin-bottom:16px;text-align:left}
  .logintabs{display:flex;background:var(--soft);border-radius:30px;padding:4px;gap:4px;margin-bottom:16px}
  .ltab{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:8px;border-radius:30px;cursor:pointer}
  .ltab.active{background:#fff;color:var(--teal-deep);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  /* ---------- APP SHELL ---------- */
  #app{min-height:100vh}
  .top{display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(100deg,var(--teal-deep),var(--teal));color:#fff;padding:10px 18px;
    padding-top:calc(10px + env(safe-area-inset-top));
    box-shadow:0 6px 18px rgba(21,94,88,.22);position:sticky;top:0;z-index:100}
  .top .brand{display:flex;align-items:center;gap:10px}
  .top .brand .badge{background:#fff;border-radius:10px;padding:4px 7px;display:flex}
  .top .brand img{height:34px;display:block}
  .top .who{display:flex;align-items:center;gap:12px;font-size:13px}
  .rolechip{background:var(--saffron);color:#3a2c00;font-weight:700;font-size:11px;padding:3px 10px;border-radius:20px}
  .logout{background:rgba(255,255,255,.16);color:#fff;border:0;padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:16px;max-width:1180px;margin:16px auto;padding:0 16px}
  .side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;height:fit-content}
  .navitem{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
  .navitem:hover{background:var(--soft)}
  .navitem.active{background:var(--teal);color:#fff}
  .navitem .ic{width:18px;text-align:center}
  .main{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;min-height:480px}
  .welcome{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .ava{width:52px;height:52px;border-radius:50%;background:var(--saffron);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none}
  .welcome h2{font-size:22px} .welcome p{font-size:13px;color:var(--muted);margin-top:2px}
  .ok-pill{display:inline-flex;align-items:center;gap:6px;background:#e2f3e9;color:var(--good);font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
  .tile{border:1px solid var(--line);border-radius:14px;padding:16px;background:linear-gradient(180deg,#fff,#fffdf8)}
  .tile .ic{font-size:22px} .tile h3{font-size:14px;margin:8px 0 4px} .tile p{font-size:12px;color:var(--muted)}
  .tile .soon{font-size:10px;font-weight:700;color:var(--saffron-deep);background:#fcefcf;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:8px}
  .tile .ready{font-size:10px;font-weight:700;color:#1f7a5a;background:#dff3e8;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:8px}
  .tile.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .tile.click:hover{border-color:var(--teal);box-shadow:0 3px 12px rgba(0,0,0,.06)}
  .note{font-size:12.5px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
  /* page header */
  .ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .ph h2{font-size:21px} .ph p{font-size:13px;color:var(--muted);margin-top:2px}
  .kbtn{background:var(--saffron);color:#3a2c00;border:0;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
  .kbtn.teal{background:var(--teal);color:#fff} .kbtn.ghost{background:var(--soft);color:var(--ink)}
  .kbtn:disabled{opacity:.55;cursor:default}
  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:18px}
  .kpi{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(180deg,#fff,#fffdf8);box-shadow:0 1px 3px rgba(43,32,24,.05);color:var(--ink)}
  .kpi .v{font-size:26px;font-weight:800;color:var(--ink)} .kpi .l{font-size:12px;color:#6b5b49} .kpi .mini{color:#6b5b49}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:11px 6px;border-bottom:1px solid #f1ead9}
  tr:last-child td{border-bottom:0}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .b-green{background:#e2f3e9;color:var(--good)} .b-red{background:#fbe7e3;color:var(--warn)}
  .b-amber{background:#fcefcf;color:#9a6b00} .b-teal{background:#f3e0e3;color:var(--teal-deep)}
  .b-grey{background:#eee7d8;color:var(--muted)}
  .rowbtn{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--teal);color:var(--teal);background:#fff;cursor:pointer;display:inline-block;margin:2px 3px 2px 0}
  .rowbtn.edit{background:var(--teal);color:#fff;border-color:var(--teal)}
  .rowbtn.danger{border-color:var(--warn);color:var(--warn)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .calhd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
  .calcell{min-height:80px;border:1px solid var(--line);border-radius:8px;background:#fffdf8;padding:4px 5px;overflow:hidden}
  .calcell.blank{background:transparent;border:0}
  .calcell.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
  .caldate{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .calev{font-size:10.5px;background:var(--teal);color:#fff;border-radius:5px;padding:2px 5px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .searchbar input{flex:1;min-width:200px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:#fffdf8}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  /* form */
  .form2{display:grid;grid-template-columns:1fr 1fr;gap:20px 26px;margin-bottom:8px}
  .panel{border:1.5px solid var(--saffron);border-radius:14px;padding:26px;margin-bottom:28px;background:#fff;box-shadow:0 3px 14px rgba(43,32,24,.08)}
  .tip{position:relative;display:inline-block;vertical-align:middle;font-weight:400}
  .tipbtn{width:22px;height:22px;border-radius:50%;border:1px solid var(--saffron-deep);background:var(--saffron);cursor:pointer;font-size:12px;line-height:20px;padding:0;vertical-align:middle;box-shadow:0 1px 3px rgba(43,32,24,.25)}
  .tipbub{display:none;position:absolute;top:30px;left:0;z-index:50;width:300px;max-width:78vw;background:#16305A;border:1px solid #0c1f3d;border-left:4px solid var(--saffron);border-radius:11px;padding:12px 14px;font-size:13px;color:#fff;line-height:1.55;font-weight:500;box-shadow:0 8px 24px rgba(11,24,48,.40);text-align:left;white-space:normal}
  .tipbub.show{display:block}
  #appFooter{ background:var(--maroon); color:#E3C285; text-align:center; font-size:15.5px; font-weight:600; letter-spacing:.4px; padding:18px 14px; }
  .tip:hover .tipbub{display:block}
  .tipbtn.warn{border-color:#7A1B14;background:#C0392B}
  .tipbub.warn{background:#7A1B14;border-color:#5a130e;border-left-color:#F0A92B;color:#fff}
  .chiptab{display:block;width:100%;text-align:left;margin:0 0 4px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600}
  .chiptab.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
  .panel h3{margin-bottom:14px}
  .footnote{background:#fdf3f1;border:1px solid #e7b9b0;border-left:4px solid var(--warn);color:#9e3b2a;border-radius:9px;padding:10px 13px;font-size:12.5px;line-height:1.55;margin:10px 0}
  .footnote b{color:#7d2c1e}
  .panel h3{font-size:14px;margin-bottom:12px}
  .kf{margin-bottom:18px}
  .kf label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .kf input,.kf select,.kf textarea{width:100%;padding:10px 12px;border:1px solid #E3C285;border-radius:9px;font-size:13.5px;background:#fffdf8;font-family:inherit}
  .kf input:focus,.kf select:focus,.kf textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
  .kf.minor-only{background:#fff7e8;border-radius:9px;padding:6px 8px}
  .kf.adult-only{background:#e9f4f2;border-radius:9px;padding:6px 8px}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink);margin-bottom:8px}
  .check input{margin-top:2px}
  .notice{font-size:11.5px;line-height:1.5;background:var(--soft);border-radius:10px;padding:12px;margin:8px 0}
  .formmsg{font-size:13px;margin:10px 0;min-height:16px}
  .formmsg.err{color:var(--warn)} .formmsg.ok{color:var(--good)}
  .dl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1ead9;font-size:13.5px}
  .dl .k{color:var(--muted)} .dl .hl{background:#fff7e8}
  .menuBtn{display:none;background:#fff;border:1px solid var(--line);border-radius:9px;font-size:20px;line-height:1;padding:3px 11px;cursor:pointer;color:#7A2233}
  @media(max-width:760px){.layout{grid-template-columns:1fr}.form2{grid-template-columns:1fr}.main table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.menuBtn{display:inline-flex;align-items:center}.side{display:none}#app.nav-open .side{display:block;margin-bottom:12px}}
  @media(max-width:600px){
    /* header */
    .top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
    .top .brand img{height:26px}
    .top .brand .badge{padding:3px 6px}
    .top .who{gap:8px;font-size:12px;min-width:0}
    .top .who #whoName{display:none}            /* name already shown in the Welcome card below */
    .rolechip{font-size:10.5px;padding:3px 9px;white-space:nowrap;flex:none}
    .logout{padding:8px 12px;font-size:12px;white-space:nowrap;flex:none}
    .menuBtn{padding:6px 11px;font-size:18px;flex:none}
    /* tighter, app-like spacing */
    .layout{margin:12px auto;padding:0 10px;gap:12px}
    .main{padding:16px 14px;border-radius:14px}
    .panel{padding:16px 14px;border-radius:13px;margin-bottom:16px}
    .welcome{gap:11px;margin-bottom:14px}
    .welcome h2{font-size:19px}
    .ava{width:44px;height:44px;font-size:19px}
    .ph h2{font-size:18px}
    /* full-width search + 16px inputs (stops iOS zoom-on-tap) */
    .searchbar{gap:8px;margin-bottom:14px}
    .searchbar input{min-width:0;flex:1 1 100%;font-size:16px;padding:12px 13px}
    .kf input,.kf select,.kf textarea{font-size:16px;padding:12px 12px}
    .field input{font-size:16px}
    .form2{gap:12px}
    /* comfortable tap targets */
    .kbtn{padding:11px 16px;font-size:14px;min-height:44px}
    .signin{padding:14px}
    .rowbtn{font-size:12px;padding:7px 12px;margin:3px 4px 3px 0}
    .navitem{padding:12px 12px;font-size:15px}
    /* KPIs + tiles: two per row */
    .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .kpi{padding:14px 13px}
    .kpi .v{font-size:22px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    /* calendar fits the width */
    .calgrid{gap:3px}
    .calcell{min-height:58px;padding:3px;border-radius:6px}
    .calev{font-size:9px;padding:1px 3px}
    .calhd{font-size:10px}
    /* footer respects the home indicator */
    #appFooter{font-size:12.5px;padding:14px 12px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  }
</style>
</head>

// Sanitiser for STORED rich-text we display as HTML (the signed consent / Code-of-Conduct
// snapshots). The app writes its own canonical notice, but the snapshot is saved via an RPC a
// signed-in user could call directly with a malicious payload — so strip scripts, embedded
// objects, event-handler attributes and dangerous URL schemes before it ever hits innerHTML.
function sanHTML(h){
  // Sanitiser for STORED rich-text we display as HTML (signed consent / CoC snapshots).
  // Uses the browser's own parser so it can't be fooled by slash-separated handlers
  // (<svg/onload=…>) or entity-encoded schemes — regex stripping is not safe here.
  if(h==null) return "";
  try{
    var docp=new DOMParser().parseFromString(String(h),"text/html");
    var BAD={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,BASE:1,FORM:1,SVG:1,MATH:1,IMG:1,VIDEO:1,AUDIO:1,SOURCE:1,TEMPLATE:1,NOSCRIPT:1};
    Array.prototype.slice.call(docp.querySelectorAll("*")).forEach(function(el){
      if(BAD[(el.tagName||"").toUpperCase()]){ el.remove(); return; }
      Array.prototype.slice.call(el.attributes).forEach(function(a){
        var n=(a.name||"").toLowerCase(), v=(a.value||"");
        if(n.indexOf("on")===0 || n==="style" || n==="srcset") el.removeAttribute(a.name);
        else if((n==="href"||n==="src"||n==="xlink:href"||n==="formaction"||n==="action") && /^\s*(javascript|data|vbscript):/i.test(v)) el.removeAttribute(a.name);
      });
    });
    return docp.body ? docp.body.innerHTML : "";
  }catch(e){ return esc(String(h)); }
}
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";          // only allow real web links in href (blocks javascript: etc.)

// Fetch ALL rows in 1000-row pages so client-side sums/percentages never silently truncate at Supabase's default cap.
async function fetchAll(makeQuery){ const SIZE=1000; let from=0, all=[]; for(;;){ const { data, error } = await makeQuery().range(from, from+SIZE-1); if(error||!data||!data.length) break; all=all.concat(data); if(data.length<SIZE) break; from+=SIZE; } return all; }
function show(v){ $("login").classList.toggle("hide", v!=="login"); $("app").classList.toggle("hide", v!=="app"); }
function msg(t, ok){ const m=$("loginMsg"); m.textContent=t; m.className="msg "+(ok?"ok":"err"); }
function ageFromDOB(d){ if(!d) return null; const b=new Date(d), n=new Date(); let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth(); if(m<0||(m===0&&n.getDate()<b.getDate())) a--; return a; }

async function init(){
  if(!cfgOk){ $("cfgwarn").classList.remove("hide"); show("login"); return; }
  let _loadedUid=null;
  const { data:{ session } } = await db.auth.getSession();
  if(session){ _loadedUid=session.user.id; loadApp(session); } else show("login");
  db.auth.onAuthStateChange((e,s)=>{
    if(e==="SIGNED_OUT"||!s){ _loadedUid=null; show("login"); return; }
    if(e==="TOKEN_REFRESHED"||e==="USER_UPDATED") return;   // routine refresh — do NOT rebuild the page (was bouncing to home)
    const uid=s.user&&s.user.id;
    if(uid && uid!==_loadedUid){ _loadedUid=uid; loadApp(s); }   // only on a genuinely new sign-in
  });
}
async function signIn(){
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){ msg("Please enter your email and password."); return; }
  $("signinBtn").disabled=true; msg("Signing in…", true);
  const { error } = await db.auth.signInWithPassword({ email, password });
  $("signinBtn").disabled=false;

async function loadApp(session){
  let role="student", name=session.user.email, warn="", pinSet=true;
  const { data, error } = await db.from("profiles").select("role, full_name, pin_set").eq("id", session.user.id);
  if(error) warn = "Couldn't read your profile — "+error.message;
  else if(data && data.length){ role=data[0].role||"student"; name=data[0].full_name||session.user.email; pinSet=data[0].pin_set!==false; }
  state.role=role; state.name=name;
  if((role==="student"||role==="teacher"||role==="admin"||role==="super_admin") && !pinSet){ renderSetPin(name, role); show("app"); return; }
  if(role==="student"){
    const kids = await loadFamily();
    if(!kids.length){ show("app"); renderInactiveStudent(name); return; }
    if(kids.length===1 && kids[0].intake_completed!==true){ state._intakeSt=kids[0]; show("app"); renderStudentIntake(kids[0]); return; }
  }
  if(role==="teacher"){
    const { data:tc } = await db.from("teachers").select("id,coc_agreed").eq("profile_id", session.user.id).maybeSingle();
    if(tc && tc.coc_agreed!==true){ show("app"); renderGuruCoC(name); return; }
  }
  renderShell(role, name, warn);
  show("app");
}

async function submitStudentIntake(){

  if(!wn) return fail("si_wa","Please enter a WhatsApp number.");

  if(!D("si_email")) return fail("si_email","Please enter the email.");

  if(!D("si_heard")) return fail("si_heard","Please choose how you found us.");
  if(!D("si_owns")) return fail("si_owns","Please choose whether you own the instrument.");
  if(!$("si_terms").checked){ m.className="formmsg err"; m.textContent="Please tick to acknowledge the IMPORTANT NOTICE."; $("si_terms").focus(); return; }
  if(!D("si_signer")) return fail("si_signer","Please enter the name of the person consenting.");

function drawAttReport(){

    $("arOut").innerHTML=summary+`<table>${head}${recs.slice().sort(byDateName).map(row).join("")}</table>`;
    return;
  }
  const keyOf=r=> group==="date"?r.date: group==="student"?r.studentId: group==="guru"?(r.guruId||"—"): (r.branchId||"—");
  const labelOf=r=> group==="date"?r.date: group==="student"?r.sName: group==="guru"?r.guruName: r.branchName;
  const groups={};

  $("arOut").innerHTML=summary+keys.map(k=>{

async function adminRaisePlan(sid){

async function generateInvoices(){
  if(state._busyMoney) return;
  if(!confirm("Raise this month's fee invoice for EVERY active student?\n\nThis creates one invoice per student (per course) for "+feePeriod().label+". Anyone who already has one is skipped.")) return;
  state._busyMoney=true;
  try{
  const P=feePeriod(); const m=$("feeMsg"); m.className="formmsg ok"; m.textContent="Generating…";
  const { data:studs } = await db.from("students").select("id,join_date,branches(monthly_fee)").or(`status.eq.active,status_effective_date.gt.${P.start}`);
  // existing invoices this period, keyed per student+course so each course bills once
  const { data:inv } = await db.from("invoices").select("student_id,course_id").lte("period_start",P.end).gte("period_end",P.start);
  const have=new Set((inv||[]).map(i=>i.student_id+"|"+(i.course_id||"")));
  const today=todayIST();
  const dim=new Date(P.year, P.monthIdx+1, 0).getDate();
  const dueFor=s=>{ const day=s.join_date?new Date(s.join_date).getDate():1; return `${P.year}-${PAD(P.monthIdx+1)}-${PAD(Math.min(day,dim))}`; };

  const sids=(studs||[]).map(s=>s.id);
  let scList=[];
  if(sids.length){ try{ const r=await db.from("student_courses").select("student_id,course_id,teacher_id,monthly_fee,status").in("student_id",sids); if(!r.error) scList=r.data||[]; }catch(e){} }
  const scByStu={}; scList.forEach(sc=>{ (scByStu[sc.student_id]=scByStu[sc.student_id]||[]).push(sc); });
  const rows=[];
  (studs||[]).forEach(s=>{
    const courses=(scByStu[s.id]||[]).filter(sc=>(!sc.status||sc.status==="active") && Number(sc.monthly_fee)>0);
    if(courses.length){
      // multi-course: one full-fee invoice per active course, credited to that course's guru
      courses.forEach(sc=>{
        const key=s.id+"|"+(sc.course_id||""); if(have.has(key)) return;
        const due=dueFor(s);
        rows.push({ student_id:s.id, course_id:sc.course_id, teacher_id:sc.teacher_id, period_label:P.label, amount:sc.monthly_fee, due_date:due, status: due<today?"overdue":"pending", months:1, period_start:P.start, period_end:P.end });
      });
    } else {

function finPeriod(){ const v=($("finMonth")&&$("finMonth").value)||todayIST().slice(0,7); const [y,m]=v.split("-").map(Number); const start=`${y}-${PAD(m)}-01`; const end=`${y}-${PAD(m)}-${PAD(new Date(y,m,0).getDate())}`; const next=`${m===12?y+1:y}-${PAD(m===12?1:m+1)}-01`; return { v, label:MONS[m-1]+" "+y, start, end, next }; }
const FREQ_LABEL={ weekly:"↻ Weekly", monthly:"↻ Monthly", yearly:"↻ Yearly" };
function parseD(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d); }
// amount an expense contributes to the month described by P (cash basis: yearly counts fully in its anniversary month)
function expenseMonthAmount(e,P){
  const f=e.frequency||"one_time"; const amt=Number(e.amount||0); const start=e.spent_on; if(!start) return 0;
  if(f==="one_time") return (start>=P.start && start<=P.end)?amt:0;
  if(start>P.end) return 0;                                   // hasn't started yet
  if(e.recur_until && e.recur_until<P.start) return 0;        // already ended
  if(f==="monthly") return amt;
  if(f==="yearly")  return start.slice(5,7)===P.start.slice(5,7)?amt:0;
  if(f==="weekly"){
    const wd=parseD(start).getDay();
    let from=parseD(start)>parseD(P.start)?parseD(start):parseD(P.start);
    let to=parseD(P.end); if(e.recur_until && parseD(e.recur_until)<to) to=parseD(e.recur_until);
    let n=0; for(let d=new Date(from); d<=to; d.setDate(d.getDate()+1)) if(d.getDay()===wd) n++;
    return amt*n;
  }
  return 0;
}
function onFreqChange(){
  const f=$("x_freq")?$("x_freq").value:"one_time"; const rec=f!=="one_time";
  if($("x_untilWrap")) $("x_untilWrap").style.display=rec?"":"none";
  if($("x_recurHint")) $("x_recurHint").style.display=rec?"":"none";
}

function recalcPayouts(){
  let totDue=0, totPaid=0;
  document.querySelectorAll(".poGard").forEach(c=>{
    const base=parseFloat(c.dataset.base)||0, paid=parseFloat(c.dataset.paid)||0;
    const pct=parseFloat(c.querySelector(".po_pct").value)||0, bonus=parseFloat(c.querySelector(".po_bonus").value)||0, ded=parseFloat(c.querySelector(".po_ded").value)||0, reimb=parseFloat(c.dataset.reimb)||0;
    const share=Math.round(base*pct/100), fin=Math.round(share+bonus+reimb-ded);
    c.querySelector(".po_share").textContent=INR(share);
    c.querySelector(".po_final").textContent=INR(fin);
    const balEl=c.querySelector(".po_bal"); balEl.textContent=INR(fin-paid); balEl.style.color=(fin-paid)>0?"var(--warn)":"var(--good)";
    totDue+=fin; totPaid+=paid;
  });
  if($("poKpis")) $("poKpis").innerHTML=`<div class="kpi"><div class="l">Total payout · ${esc(state._poLabel||"")}</div><div class="v">${INR(totDue)}</div></div>
    <div class="kpi"><div class="l">Total paid</div><div class="v" style="color:var(--good)">${INR(totPaid)}</div></div>
    <div class="kpi"><div class="l">Outstanding</div><div class="v" style="color:${totDue-totPaid>0?'var(--warn)':'var(--ink)'}">${INR(totDue-totPaid)}</div></div>`;
}
function recordPayoutForm(tid){

async function savePayout(tid){
  if(state._busyMoney) return; state._busyMoney=true;
  try{
  const m=$("po_msg_"+tid); const amt=Number($("po_amt_"+tid).value); const date=$("po_date_"+tid).value;
  if(!amt||amt<=0){ m.className="formmsg err"; m.textContent="Enter an amount."; return; }
  if(!date){ m.className="formmsg err"; m.textContent="Pick a date."; return; }
  m.className="formmsg ok"; m.textContent="Saving…";
  const { error } = await db.from("guru_payouts").insert({ teacher_id:tid, period:state._poPeriod, amount:amt, paid_on:date, method:$("po_method_"+tid).value, note:$("po_note_"+tid).value.trim()||null });
  if(error){ m.className="formmsg err"; m.textContent="Couldn't save — "+error.message; return; }
  try{ await db.from("guru_reimbursements").update({ status:"paid", paid_period:state._poPeriod }).eq("teacher_id",tid).eq("status","approved"); }catch(e){}
  loadPayouts();
  } finally { state._busyMoney=false; }
}
async function reviewReimb(id, status){
  let note=null;
  if(status==="rejected"){ note=prompt("Reason for rejecting (optional):"); if(note===null) return; note=(note||"").trim()||null; }
  else if(!confirm("Approve this reimbursement? It will be added to the guru's payout.")) return;
  let uid=null; try{ const { data:{ user } }=await db.auth.getUser(); uid=user?user.id:null; }catch(e){}
  const { error } = await db.from("guru_reimbursements").update({ status, reviewed_at:new Date().toISOString(), reviewed_by:uid, review_note:note }).eq("id",id);
  if(error){ alert("Couldn't update — "+error.message); return; }
  loadPayouts();
}
async function savePlan(tid){

    pct:parseFloat(c.querySelector(".po_pct").value)||0,

  if(!name) return failMsg(m,"Enter a name.");
  const rec={ name, phone:phone||null, whatsapp:phone||null, course_id:$("e_course").value||null, branch_id:$("e_branch").value||null, source:$("e_source").value, mode:$("e_mode").value, country:($("e_country")&&$("e_country").value)||"India", message:$("e_msg").value.trim()||null };

function editEnquiry(id){

function cancelEnqEdit(){
  state._enqEdit=null;

  if($("e_course")) $("e_course").value=""; if($("e_branch")) $("e_branch").value=""; if($("e_country")) $("e_country").value="India";

async function setEnqStage(id,stage){
  const { error } = await db.from("enquiries").update({ stage }).eq("id",id);
  if(error){ alert("Couldn't update — "+error.message); return; }
  const e=(state._enq||[]).find(x=>x.id===id); if(e) e.stage=stage;
  drawEnquiries();
}
async function logEnqNote(id){
  const txt=prompt("Add a follow-up note (e.g. 'Called — will visit Sat'):");
  if(txt==null||!txt.trim()) return;
  const e=(state._enq||[]).find(x=>x.id===id);
  const stamp=todayIST();
  const line=`${stamp}: ${txt.trim()}`;
  const merged=e&&e.follow_up_log?(e.follow_up_log+"\n"+line):line;
  const { error } = await db.from("enquiries").update({ follow_up_log:merged }).eq("id",id);
  if(error){ alert("Couldn't save note — "+error.message); return; }
  if(e) e.follow_up_log=merged;
  drawEnquiries();
}
async function convertEnq(id){
  if(!confirm("Mark this lead as Converted and open Quick Register, pre-filled with their details?")) return;
  const { data:eq } = await db.from("enquiries").select("id,name,phone,whatsapp,branch_id,course_id").eq("id",id).maybeSingle();
  const { error } = await db.from("enquiries").update({ stage:"converted" }).eq("id",id);
  if(error){ alert("Couldn't update — "+error.message); return; }
  const e=(state._enq||[]).find(x=>x.id===id); if(e) e.stage="converted";
  state._convertEnq=eq||null; state._intakeMode='';   // prefill Quick Register + remember which lead to link
  gotoNav("intake");
}
async function delEnquiry(id){
  if(!confirm("Delete this enquiry? This can't be undone.")) return;
  const { error } = await db.from("enquiries").delete().eq("id",id);
  if(error){ alert("Couldn't delete — "+error.message); return; }
  state._enq=(state._enq||[]).filter(x=>x.id!==id); drawEnquiries();
}

const INV_TYPES=["Instrument","Prop","Costume","Equipment","Other"];
const INV_CONDS=["Good","Needs service","Under repair","Retired"];
const INV_COND_BADGE={ "Good":"b-green", "Needs service":"b-amber", "Under repair":"b-red", "Retired":"b-grey" };
const INV_LEAD_DAYS=7;
function invAddMonths(dateStr,months){ const [y,m,d]=String(dateStr).slice(0,10).split("-").map(Number); const b=new Date(Date.UTC(y,(m-1)+months,d)); return b.getUTCFullYear()+"-"+String(b.getUTCMonth()+1).padStart(2,"0")+"-"+String(b.getUTCDate()).padStart(2,"0"); }
function invNextDue(i){ if(!i.service_interval_months||Number(i.service_interval_months)<=0) return null; const base=i.last_serviced||i.purchase_date; if(!base) return null; return invAddMonths(base,Number(i.service_interval_months)); }
function invDueStatus(i){ const nd=invNextDue(i); if(!nd) return null; const t=todayIST(); const gap=Math.round((Date.parse(nd+"T00:00:00Z")-Date.parse(t+"T00:00:00Z"))/86400000); return { nextDue:nd, gap, overdue:gap<0, dueNow:gap<=0, dueSoon:gap>0&&gap<=INV_LEAD_DAYS }; }

  const rows=(data||[]).map(r=>{ const ist=new Date(new Date(r.at).getTime()+19800000).toISOString().slice(0,16).replace("T"," ");
    return `<tr><td class="mini">${esc(ist)}</td><td>${esc(r.actor_name||"—")}</td><td><span class="badge ${aBadge[r.action]||"b-grey"}">${aLabel[r.action]||r.action}</span> ${esc(eLabel[r.entity]||r.entity)}</td><td class="mini">${esc(r.detail||"")}</td></tr>`; }).join("");
  M.innerHTML=`<div class="ph"><div><h2>Activity log${tip("An automatic trail of who changed or deleted students, fees and payments — handy to check what happened and when.")}</h2><p>Who changed or deleted what — students, fees &amp; payments (most recent first)</p></div></div>
    ${data&&data.length?`<table><tr><th>When (IST)</th><th>Who</th><th>What</th><th>Detail</th></tr>${rows}</table>`:`<div class="empty">No activity recorded yet. New changes will appear here.</div>`}`;
}

function drawInventory(){
  const all=state._inv||[];
  const bname=id=>{ const b=state.branches.find(x=>x.id===id); return b?b.name:"—"; };
  let totVal=0, attention=0, dueNow=0, dueSoon=0;
  all.forEach(i=>{ totVal+=Number(i.purchase_cost||0); if(i.condition==="Needs service"||i.condition==="Under repair") attention++; const st=invDueStatus(i); if(st){ if(st.dueNow) dueNow++; else if(st.dueSoon) dueSoon++; } });
  $("invKpis").innerHTML=`<div class="kpi"><div class="l">Total items</div><div class="v">${all.length}</div></div>
    <div class="kpi"><div class="l">Needs attention</div><div class="v" style="color:var(--warn)">${attention}</div></div>
    <div class="kpi"><div class="l">Service due</div><div class="v" style="color:${dueNow?"var(--warn)":"inherit"}">${dueNow}</div><div class="mini">${dueSoon} coming up</div></div>
    <div class="kpi"><div class="l">Total purchase value</div><div class="v">${INR(totVal)}</div></div>`;
  if($("invDueBanner")){ if(dueNow||dueSoon){ const red=dueNow>0; $("invDueBanner").innerHTML=`<div style="margin:0 0 14px;background:${red?"#fdecea":"#FCF3DD"};border:1px solid ${red?"#f3c0b8":"#e7cf95"};border-radius:9px;padding:10px 13px;font-size:13px;color:${red?"#9B2226":"#7a5d12"}">${red?"⚠️":"🛠"} <b>${dueNow}</b> item${dueNow===1?"":"s"} due or overdue for service${dueSoon?`, <b>${dueSoon}</b> coming up in the next ${INV_LEAD_DAYS} days`:""}. The super admin also gets these by email.</div>`; } else $("invDueBanner").innerHTML=""; }
  const q=(($("invSearch")&&$("invSearch").value)||"").toLowerCase().trim();
  const bf=($("invBranchF")&&$("invBranchF").value)||"";
  const cf=($("invCondF")&&$("invCondF").value)||"";
  let list=all.filter(i=>{
    if(bf && i.branch_id!==bf) return false;
    if(cf && i.condition!==cf) return false;
    if(q && !((i.name||"").toLowerCase().includes(q))) return false;
    return true;
  });
  if(!list.length){ $("invList").innerHTML=`<div class="empty">No items${q||bf||cf?" match this filter":" yet — add your first above"}.</div>`; return; }
  $("invList").innerHTML=`<table><tr><th>Item</th><th>Type</th><th>Branch</th><th>Condition</th><th>Last serviced</th><th>Next service</th><th>Cost</th><th></th></tr>
    ${list.map(i=>`<tr>
      <td><b>${esc(i.name)}</b>${i.notes?`<br><span class="mini">${esc(i.notes)}</span>`:""}</td>
      <td>${esc(i.item_type||"—")}</td>
      <td>${esc(bname(i.branch_id))}</td>
      <td><span class="badge ${INV_COND_BADGE[i.condition]||"b-grey"}">${esc(i.condition||"—")}</span></td>
      <td class="mini">${i.last_serviced?esc(i.last_serviced):"—"}</td>
      <td class="mini">${(()=>{ const st=invDueStatus(i); if(!st) return "—"; return `<span class="badge ${st.overdue?"b-red":(st.dueSoon?"b-amber":"b-green")}">${esc(st.nextDue)}</span>`+(st.overdue?`<br><span class="mini" style="color:#9B2226">${-st.gap}d overdue</span>`:""); })()}</td>
      <td>${i.purchase_cost?INR(i.purchase_cost):"—"}</td>
      <td class="mini">${invNextDue(i)?`<span class="rowbtn" onclick="logServiceDate('${i.id}')">🛠 Log service</span>`:""}<span class="rowbtn edit" onclick="editInvItem('${i.id}')">✏️ Edit</span><span class="rowbtn danger" onclick="delInvItem('${i.id}')">Delete</span></td>
    </tr>`).join("")}</table>
    <p class="footnote">Tip: log a repair or new-purchase <b>cost</b> as an expense in Finance &amp; P&amp;L (category “Instruments” or “Maintenance”) so it flows into your centre P&amp;L.</p>`;
}

async function resolveZoom(mode, typed, teacherId){

function _toMin(t){ if(!t) return null; const x=String(t).split(":"); return Number(x[0])*60+Number(x[1]||0); }

async function fillMonthFromTemplate(){
  if(state._busyTpl) return; state._busyTpl=true;
  const m=$("tplMsg"); const mv=$("tplMonth")&&$("tplMonth").value;
  try{
    if(!mv){ if(m){ m.className="formmsg err"; m.textContent="Pick a month first."; } return; }
    const [y,mo]=mv.split("-").map(Number);
    const cls=(state._classes||[]).filter(b=>b.is_active!==false && b.day_of_week!=null && b.published_at);
    if(!cls.length){ m.className="formmsg err"; m.textContent="No weekly classes ready yet — add one below (any a guru added need a quick ✅ ‘Mark reviewed’ first)."; return; }
    m.className="formmsg ok"; m.textContent="Filling…"; $("tplFillBtn").disabled=true;
    const start=`${y}-${PAD(mo)}-01`, end=`${y}-${PAD(mo)}-${PAD(new Date(y,mo,0).getDate())}`;
    const { data:existing } = await db.from("class_sessions").select("title,session_date,start_time").gte("session_date",start).lte("session_date",end);
    const seen=new Set((existing||[]).map(x=>`${x.title}|${x.session_date}|${(x.start_time||"").slice(0,5)}`));
    const dim=new Date(y,mo,0).getDate(); const rows=[];
    for(let d=1;d<=dim;d++){
      const dow=new Date(y,mo-1,d).getDay(); const ds=`${y}-${PAD(mo)}-${PAD(d)}`;
      cls.forEach(b=>{
        if(b.day_of_week!==dow) return;
        const key=`${b.name}|${ds}|${(b.start_time||"").slice(0,5)}`;
        if(seen.has(key)) return; seen.add(key);
        rows.push({ title:b.name, teacher_id:b.teacher_id||null, branch_id:b.branch_id||null, session_date:ds, start_time:b.start_time||null, mode:b.mode||"in_person", capacity:b.capacity||8, zoom_link:b.zoom_link||null, room:b.room||null, batch_id:b.id });
      });
    }
    if(!rows.length){ m.className="formmsg ok"; m.textContent="Nothing to add — that month is already filled from the template."; return; }
    const { error } = await db.from("class_sessions").insert(rows);
    if(error){ m.className="formmsg err"; m.textContent="Couldn't fill — "+error.message; return; }
    m.className="formmsg ok"; m.textContent=`✓ Added ${rows.length} class${rows.length===1?"":"es"} to ${MONS[mo-1]} ${y}. Open the Calendar to see or adjust them.`;
  } finally { state._busyTpl=false; if($("tplFillBtn")) $("tplFillBtn").disabled=false; }
}
async function saveClass(){
  const m=$("clMsg"); const name=$("cl_name").value.trim();
  if(!name) return failMsg(m,"Enter a class name.");
  const dow=$("cl_dow").value; const mode=$("cl_mode").value||"in_person";
  const room=$("cl_room")?$("cl_room").value.trim():"";
  const rec={ name, course_id:$("cl_course").value||null, teacher_id:$("cl_teacher").value||null, branch_id:$("cl_branch").value||null,
    mode, day_of_week: dow===""?null:Number(dow), start_time:$("cl_time").value||null, room:room||null,
    capacity:Number($("cl_cap").value)||8, zoom_link:((mode==="online"||mode==="hybrid")&&$("cl_zoom").value.trim())||null };
  rec.zoom_link = await resolveZoom(mode, $("cl_zoom").value, rec.teacher_id);
  if((mode==="online"||mode==="hybrid") && !rec.zoom_link) return failMsg(m,"This online/hybrid class has no Zoom link. Type one here, or set this guru's default link in Gurus → Edit.");
  // room clash guard: no two classes in the same branch + room + day + time
  if(rec.branch_id && room && rec.day_of_week!=null && rec.start_time){
    let cq=db.from("batches").select("id,name").eq("branch_id",rec.branch_id).eq("day_of_week",rec.day_of_week).eq("start_time",rec.start_time).ilike("room",room).eq("is_active",true);
    if(state._clsEdit) cq=cq.neq("id",state._clsEdit);
    const { data:clash } = await cq;
    if(clash&&clash.length) return failMsg(m,`Room clash: "${clash[0].name}" already uses ${room} on that day & time. Pick another room or time.`);
  }
  if(!(await onlineSlotOK({mode, kind:"batch", dow:rec.day_of_week, start:rec.start_time, excludeId:state._clsEdit||null}))){ m.className="formmsg"; m.textContent=""; return; }
  m.className="formmsg ok"; m.textContent="Saving…"; $("addCls").disabled=true;
  let error;
  if(state._clsEdit){ ({ error } = await db.from("batches").update(rec).eq("id",state._clsEdit)); }
  else { ({ error } = await db.from("batches").insert({ ...rec, is_published:true, published_at:new Date().toISOString() })); }
  $("addCls").disabled=false;
  if(error) return failMsg(m,"Couldn't save — "+error.message);
  m.className="formmsg ok"; m.textContent=state._clsEdit?"✓ Class updated.":"✓ Class added.";
  cancelClsEdit(); loadClasses();
}

      <div class="form2"><div class="kf"><label>Amount (₹)</label><input id="rb_amt" type="number" min="1"></div><div class="kf"><label>What was it for?</label><input id="rb_reason" placeholder="e.g. printed sheets, props"></div></div>
      <div class="kf"><label>Receipt (optional)</label><input id="rb_file" type="file" accept="image/*" style="font-size:12.5px"></div>

  $("earnSel").onchange=e=>showEarnMonth(e.target.value);
  showEarnMonth(rows[0].k);
  loadMyReimb();
}
async function submitReimb(){
  const m=$("rb_msg"); const amt=Number($("rb_amt").value); const reason=($("rb_reason").value||"").trim();
  if(!amt||amt<=0) return failMsg(m,"Enter an amount.");
  const tid=await myTeacherId(); if(!tid) return failMsg(m,"Your guru profile isn't set up.");
  let receipt=null; const file=$("rb_file")&&$("rb_file").files[0];
  m.className="formmsg ok"; m.textContent=file?"Uploading receipt…":"Submitting…"; $("rb_submit").disabled=true;
  if(file){ try{ receipt=await uploadImage(file); }catch(e){ $("rb_submit").disabled=false; return failMsg(m,"Receipt upload failed — "+(e.message||e)); } }
  const { error } = await db.from("guru_reimbursements").insert({ teacher_id:tid, amount:amt, reason:reason||null, receipt_url:receipt });
  $("rb_submit").disabled=false;
  if(error) return failMsg(m,"Couldn't submit — "+error.message);
  m.className="formmsg ok"; m.textContent="✓ Submitted — the admin will review it."; $("rb_amt").value=""; $("rb_reason").value=""; if($("rb_file")) $("rb_file").value="";
  loadMyReimb();
}
async function loadMyReimb(){
  const tid=await myTeacherId(); if(!tid||!$("rb_list")) return;
  const { data } = await db.from("guru_reimbursements").select("id,amount,reason,status,created_at,review_note,paid_period").eq("teacher_id",tid).order("created_at",{ascending:false});
  const badge={pending:"b-amber",approved:"b-teal",rejected:"b-red",paid:"b-green"};
  $("rb_list").innerHTML=(data&&data.length)?`<table><tr><th>Date</th><th>For</th><th>Amount</th><th>Status</th></tr>${data.map(r=>`<tr><td class="mini">${String(r.created_at).slice(0,10)}</td><td>${esc(r.reason||"—")}</td><td><b>${INR(r.amount)}</b></td><td><span class="badge ${badge[r.status]||"b-grey"}">${esc(r.status)}</span>${r.status==="rejected"&&r.review_note?`<br><span class="mini" style="color:var(--muted)">${esc(r.review_note)}</span>`:""}${r.status==="paid"&&r.paid_period?`<br><span class="mini" style="color:var(--muted)">in ${esc(r.paid_period)} payout</span>`:""}</td></tr>`).join("")}</table>`:`<div class="mini" style="color:var(--muted)">No requests yet.</div>`;
}
function showEarnMonth(k){
  const r=(state._earnRows||[]).find(x=>x.k===k); if(!r||!$("earnDetail")) return;
  $("earnDetail").innerHTML=`<div class="kpis" style="margin:4px 0 0">
      <div class="kpi"><div class="l">Paid to you · ${esc(r.label)}</div><div class="v" style="color:var(--good)">${INR(r.paid)}</div></div>
    </div>
    <div style="margin-top:12px">${r.paid>0?`<span class="rowbtn edit" onclick="genPayoutInvoice('${r.k}')">📄 Statement — ${esc(r.label)}</span>`:`<span class="mini" style="color:var(--muted)">No payment recorded for ${esc(r.label)} yet.</span>`}</div>`;
}

async function renderMyCalendar(){
  const M=$("mainArea"); M.innerHTML=`<div class="empty">Loading…</div>`;
  const tid=await myTeacherId();
  if(!tid){ M.innerHTML=`<div class="ph"><div><h2>My Calendar</h2></div></div><div class="cfgwarn">Your guru profile isn't fully set up yet. Ask the admin to check your account.</div>`; return; }
  await loadRef(); await loadClassRefs();
  state._mcalTid=tid; state._mcalMonth=state._mcalMonth||todayIST().slice(0,7); state._mySessEdit=null;
  const branchOpts=state.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("");
  M.innerHTML=`<div class="ph"><div><h2>My Calendar${tip("Set your weekly class times — students and admin all see this. For online classes, your saved Zoom link is added automatically.")}</h2><p>Schedule your classes for the week — everyone can see this</p></div></div>
    <div class="panel" style="margin-bottom:14px"><h3 id="mcsFormTitle">Schedule a class</h3>
      <p class="footnote" style="margin:0 0 10px">Pick a date (or click a day below) and place your class on it. Your schedule can differ week to week.</p>
      <div class="form2">
        <div class="kf"><label>Class name *</label><input id="mcs_title" placeholder="e.g. Kathak — Beginners"></div>
        <div class="kf"><label>Branch</label><select id="mcs_branch"><option value="">—</option>${branchOpts}</select></div>
      </div>
      <div class="form2">
        <div class="kf"><label>Date *</label><input id="mcs_date" type="date"></div>
        <div class="kf"><label>Start time</label><input id="mcs_time" type="time"></div>
      </div>
      <div class="form2">
        <div class="kf"><label>Capacity</label><input id="mcs_cap" type="number" min="1" value="8"></div>
        <div class="kf"><label>Mode</label><select id="mcs_mode" onchange="onMySessMode()"><option value="in_person">In-person</option><option value="online">Online</option><option value="hybrid">Hybrid</option></select></div>
      </div>
      <div class="kf" id="mcs_zoomWrap" style="display:none"><label>Zoom / meeting link</label><input id="mcs_zoom" placeholder="https://…"></div>
      <div class="formmsg" id="mcsMsg"></div>
      <button class="kbtn teal" id="addMcs" onclick="saveMySession()">Add class to calendar</button>
      <button class="kbtn ghost" id="mcsCancelBtn" style="display:none;margin-left:6px" onclick="cancelMySessEdit()">Cancel</button>
    </div>
    <div class="searchbar" style="justify-content:space-between">
      <div><button class="kbtn ghost" onclick="mcalShift(-1)">‹ Prev</button><b id="mcalLabel" style="margin:0 12px"></b><button class="kbtn ghost" onclick="mcalShift(1)">Next ›</button></div>
      <button class="kbtn ghost" onclick="mcalToday()">Today</button></div>
    <div id="mcalGrid"><div class="empty">Loading…</div></div>
    <div id="mcalList"></div>`;
  $("mcs_date").value=todayIST();
  loadMyCalendar();
}
async function loadMyCalendar(){
  const [y,mo]=state._mcalMonth.split("-").map(Number);
  const start=`${y}-${PAD(mo)}-01`, end=`${y}-${PAD(mo)}-${PAD(new Date(y,mo,0).getDate())}`;
  const { data:annc } = await db.from("news_posts").select("id,title,event_type,event_date,event_end").not("event_date","is",null).lte("event_date",end).or(`event_end.gte.${start},and(event_end.is.null,event_date.gte.${start})`).order("event_date");
  const { data:sess } = await db.from("class_sessions").select("id,title,teacher_id,session_date,start_time,mode,capacity,zoom_link,branch_id").gte("session_date",start).lte("session_date",end).order("session_date");
  state._mcalEvents=(annc||[]).map(e=>({ id:e.id, title:e.title, event_date:e.event_date, end_date:e.event_end, event_type:e.event_type })); state._mcalSess=sess||[]; drawMyCalendar();
}
function drawMyCalendar(){
  const tid=state._mcalTid;
  const [y,mo]=state._mcalMonth.split("-").map(Number);
  if($("mcalLabel")) $("mcalLabel").textContent=MONS[mo-1]+" "+y;
  const mStart=new Date(y,mo-1,1), mEnd=new Date(y,mo,0), dim=mEnd.getDate(), first=mStart.getDay();
  const todayS=todayIST();
  const byDay={}; (state._mcalEvents||[]).forEach(e=>{ const s=parseD(String(e.event_date).slice(0,10)); const en=e.end_date?parseD(String(e.end_date).slice(0,10)):s; let d=new Date(Math.max(s,mStart)); const last=new Date(Math.min(en,mEnd)); for(;d<=last;d.setDate(d.getDate()+1)){ const day=d.getDate(); (byDay[day]=byDay[day]||[]).push(e); } });
  const sessByDay={}; (state._mcalSess||[]).forEach(c=>{ const day=Number(String(c.session_date).slice(8,10)); (sessByDay[day]=sessByDay[day]||[]).push(c); });
  const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="calhd">${d}</div>`).join("");
  let cells="";
  for(let i=0;i<first;i++) cells+=`<div class="calcell blank"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${PAD(mo)}-${PAD(d)}`;
    const clsChips=(sessByDay[d]||[]).sort((a,b)=>String(a.start_time||"").localeCompare(String(b.start_time||""))).map(c=>{ const mine=c.teacher_id===tid;
      return `<div class="calev" style="background:${mine?"var(--saffron)":"#e6e0d4"};color:#3a2c00;border-color:${mine?"var(--saffron)":"#e6e0d4"}"${mine?` onclick="event.stopPropagation();editMySession('${c.id}')"`:""} title="${esc(c.title)} · ${esc(teacherName(c.teacher_id))}${c.start_time?' · '+fmtTime(c.start_time.slice(0,5)):''}">${c.start_time?fmtTime(c.start_time.slice(0,5))+' · ':''}${esc(c.title)}</div>`; }).join("");
    const evs=(byDay[d]||[]).map(e=>`<div class="calev" title="${esc(e.title)}">${esc(e.title)}</div>`).join("");
    cells+=`<div class="calcell${ds===todayS?" today":""}" style="cursor:pointer" onclick="pickMySessDate('${ds}')" title="Click to schedule your class on ${ds}"><div class="caldate">${d}</div>${clsChips}${evs}</div>`;
  }
  $("mcalGrid").innerHTML=`<div class="calgrid">${wd}${cells}</div>
    <div class="mini" style="margin-top:8px;color:var(--muted)"><span class="badge" style="background:var(--saffron);color:#3a2c00">your classes</span> <span class="badge" style="background:#e6e0d4;color:#3a2c00">other gurus</span> <span class="badge b-teal">school events</span> · click a day to add yours</div>`;
  const mine=(state._mcalSess||[]).filter(c=>c.teacher_id===tid);
  $("mcalList").innerHTML=mine.length?`<div class="panel" style="margin-top:14px"><h3>Your classes in ${MONS[mo-1]} ${y}</h3>
    <table><tr><th>Date</th><th>Class</th><th>Time</th><th></th></tr>${mine.map(c=>`<tr><td>${esc(c.session_date)}</td><td><b>${esc(c.title)}</b></td><td class="mini">${c.start_time?fmtTime(c.start_time.slice(0,5)):"—"}</td><td class="mini"><span class="rowbtn edit" onclick="editMySession('${c.id}')">✏️ Edit</span><span class="rowbtn danger" onclick="delMySession('${c.id}')">Delete</span></td></tr>`).join("")}</table></div>`:`<div class="empty">You haven't scheduled any classes in ${MONS[mo-1]} ${y} — add one above or click a day.</div>`;
}
function onMySessMode(){ const m=$("mcs_mode")?$("mcs_mode").value:"in_person"; if($("mcs_zoomWrap")) $("mcs_zoomWrap").style.display=(m==="online"||m==="hybrid")?"":"none"; }
function pickMySessDate(ds){ if($("mcsDetails")) $("mcsDetails").open=true; if($("mcs_date")) $("mcs_date").value=ds; const m=$("mcsMsg"); if(m){ m.className="formmsg ok"; m.textContent="Date set to "+ds+" — fill the details and Add."; } window.scrollTo({top:0,behavior:"smooth"}); if($("mcs_title")) $("mcs_title").focus(); }
async function saveMySession(){
  const m=$("mcsMsg"); const title=$("mcs_title").value.trim(), date=$("mcs_date").value, tid=state._mcalTid;
  if(!title){ m.className="formmsg err"; m.textContent="Enter a class name."; return; }
  if(!date){ m.className="formmsg err"; m.textContent="Pick a date."; return; }
  const mode=$("mcs_mode").value||"in_person";
  const rec={ title, teacher_id:tid, branch_id:$("mcs_branch").value||null, session_date:date, start_time:$("mcs_time").value||null, mode, capacity:Number($("mcs_cap").value)||8, zoom_link:((mode==="online"||mode==="hybrid")&&$("mcs_zoom").value.trim())||null };
  m.className="formmsg ok"; m.textContent="Saving…"; $("addMcs").disabled=true;
  let error;
  if(state._mySessEdit){ ({ error } = await db.from("class_sessions").update(rec).eq("id",state._mySessEdit)); }
  else { ({ error } = await db.from("class_sessions").insert(rec)); }
  $("addMcs").disabled=false;
  if(error){ m.className="formmsg err"; m.textContent="Couldn't save — "+error.message; return; }
  m.className="formmsg ok"; m.textContent=state._mySessEdit?"✓ Class updated.":"✓ Added to the calendar.";
  state._mcalMonth=date.slice(0,7); cancelMySessEdit(); loadMyCalendar();
}
function editMySession(id){
  const c=(state._mcalSess||[]).find(x=>x.id===id); if(!c||c.teacher_id!==state._mcalTid) return;
  state._mySessEdit=id;
  if($("mcsDetails")) $("mcsDetails").open=true;
  $("mcs_title").value=c.title||""; $("mcs_branch").value=c.branch_id||""; $("mcs_date").value=c.session_date||"";
  $("mcs_time").value=c.start_time?c.start_time.slice(0,5):""; $("mcs_mode").value=c.mode||"in_person"; $("mcs_cap").value=c.capacity||8; if($("mcs_zoom")) $("mcs_zoom").value=c.zoom_link||"";
  onMySessMode();
  $("mcsFormTitle").textContent="Edit class"; $("addMcs").textContent="Save changes"; $("mcsCancelBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
}
function cancelMySessEdit(){
  state._mySessEdit=null;
  ["mcs_title","mcs_time","mcs_zoom"].forEach(x=>{ if($(x)) $(x).value=""; }); if($("mcs_branch")) $("mcs_branch").value="";
  if($("mcs_mode")) $("mcs_mode").value="in_person"; if($("mcs_cap")) $("mcs_cap").value=8; onMySessMode();
  if($("mcs_date")) $("mcs_date").value=todayIST();
  if($("mcsFormTitle")) $("mcsFormTitle").textContent="Schedule a class";
  if($("addMcs")) $("addMcs").textContent="Add class to calendar";
  if($("mcsCancelBtn")) $("mcsCancelBtn").style.display="none";
}
async function delMySession(id){
  if(!confirm("Delete this class from the calendar?")) return;
  const { error } = await db.from("class_sessions").delete().eq("id",id);
  if(error){ alert("Couldn't delete — "+error.message); return; }
  loadMyCalendar();
}
function mcalShift(d){ const [y,mo]=state._mcalMonth.split("-").map(Number); const t=y*12+(mo-1)+d; state._mcalMonth=Math.floor(t/12)+"-"+PAD((t%12)+1); loadMyCalendar(); }
function mcalToday(){ state._mcalMonth=todayIST().slice(0,7); loadMyCalendar(); }

/* ---------------- ANNOUNCEMENTS — shared response helpers ---------------- */
async function myUid(){ if(state._uid) return state._uid; const { data:{ user } } = await db.auth.getUser(); state._uid=user?user.id:null; return state._uid; }
function respButtonsHTML(n, myResp){
  const cfg=RESP_OPTS[n.response_type]; if(!cfg) return "";
  if(n.response_type==="ack") return `<div style="margin-top:12px">${myResp==="ack"?`<span class="badge b-green">✓ You've got it</span> <span class="rowbtn" onclick="respondNews('${n.id}','')">undo</span>`:`<button class="kbtn teal" onclick="respondNews('${n.id}','ack')">Got it ✓</button>`}</div>`;
  const b=(v,l)=>`<button class="kbtn ${myResp===v?"teal":"ghost"}" style="margin:4px 6px 0 0" onclick="respondNews('${n.id}','${v}')">${esc(l)}</button>`;
  return `<div style="margin-top:12px"><div class="mini" style="margin-bottom:4px">${esc(cfg.prompt)}</div>${cfg.opts.map(o=>b(o[0],o[1])).join("")}</div>`;
}
function announceCardHTML(n, myResp){
  regAnn(n);
  const al=n.align==="center"?"center":"left";
  const imgStyle=`${n.img_full?"width:100%;max-width:100%":"max-width:320px;max-height:220px"};border-radius:8px;margin:10px 0 0;border:1px solid var(--line)`;
  return `<div class="panel" style="margin-bottom:12px">
    <div style="text-align:${al}">
    <b style="font-size:15px">${esc(n.title)}</b><div class="mini" style="margin-top:2px">${String(n.created_at).slice(0,10)}</div>
    ${n.body?`<p style="margin:10px 0 0;white-space:pre-wrap">${esc(n.body)}</p>`:""}
    ${n.media_url?(/(\.(png|jpe?g|gif|webp|svg)(\?|$)|\/uploads\/)/i.test(n.media_url)?`<img src="${esc(n.media_url)}" style="${imgStyle}">`:`<p class="mini" style="margin:8px 0 0">🔗 <a href="${esc(safeUrl(n.media_url))}" target="_blank" rel="noopener">${esc(n.media_url)}</a></p>`):""}
    </div>
    ${respButtonsHTML(n, myResp)}
    ${state.role==="student"
      ? `<div style="margin-top:13px;background:#fff7e8;border:1px solid #f0e2c0;border-radius:10px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="font-size:13px;color:#7a5e1f">💛 <b>Spread the word!</b> Feel free to share this with your friends &amp; family.</div><button class="kbtn teal" style="flex:none" onclick="shareAnnounce('${n.id}')">🔗 Share</button></div>`
      : `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><span class="rowbtn" onclick="shareAnnounce('${n.id}')">🔗 Share</span></div>`}
  </div>`;
}
async function respondNews(postId, resp){
  const uid=await myUid(); if(!uid) return;
  if(resp===""){ await db.from("news_responses").delete().eq("news_post_id",postId).eq("profile_id",uid); }
  else { const { error } = await db.from("news_responses").upsert({ news_post_id:postId, profile_id:uid, response:resp },{ onConflict:"news_post_id,profile_id" }); if(error){ alert("Couldn't record — "+error.message); return; } }
  if(state.role==="student") renderStudentNews(); else renderNotices();
}
async function loadMyResponses(){
  const uid=await myUid(); const map={};
  if(uid){ const { data:rs } = await db.from("news_responses").select("news_post_id,response").eq("profile_id",uid); (rs||[]).forEach(r=>map[r.news_post_id]=r.response); }
  return map;
}

/* ---------------- GURU SAMVAAD (quarterly 1:1 student–guru feedback session) ---------------- */
function addMonths(d,m){ return new Date(d.getFullYear(), d.getMonth()+m, d.getDate()); }
function isoLocal(d){ return `${d.getFullYear()}-${PAD(d.getMonth()+1)}-${PAD(d.getDate())}`; }
function fmtNiceDate(s){ const [y,m,dd]=String(s).slice(0,10).split("-").map(Number); return `${dd} ${MONS[m-1]} ${y}`; }
function fmtDateTime(s){ const d=new Date(s); return `${d.getDate()} ${MONS[d.getMonth()]} ${d.getFullYear()}, ${(d.getHours()%12||12)}:${PAD(d.getMinutes())} ${d.getHours()<12?"AM":"PM"}`; }
// quarterly from join date → which cycle is actionable + its state
function ptmStatus(joinDate, today, srv){
  const j=parseD(joinDate);
  let months=(today.getFullYear()-j.getFullYear())*12+(today.getMonth()-j.getMonth());
  if(today.getDate()<j.getDate()) months--;
  const n=Math.max(0,Math.floor(months/3));
  const pastB=addMonths(j,n*3), nextB=addMonths(j,(n+1)*3);
  const keyPast=isoLocal(pastB), keyNext=isoLocal(nextB);
  const rPast=srv.find(r=>r.quarter_label===keyPast), rNext=srv.find(r=>r.quarter_label===keyNext);
  const daysSincePast=Math.round((today-pastB)/864e5), daysToNext=Math.round((nextB-today)/864e5);
  if(rNext && rNext.status==="scheduled") return { state:"scheduled", cycle:keyNext, review:rNext };
  if(rPast && rPast.status==="scheduled") return { state:"scheduled", cycle:keyPast, review:rPast };
  if(rPast && rPast.status==="completed"){ return (daysToNext<=30)?{ state:"due", cycle:keyNext }:{ state:"upcoming", cycle:keyNext }; }
  if(n>=1){ return (daysSincePast>14)?{ state:"overdue", cycle:keyPast }:{ state:"due", cycle:keyPast }; }
  return (daysToNext<=30)?{ state:"due", cycle:keyNext }:{ state:"upcoming", cycle:keyNext };
}

const PTM_LABEL={ overdue:"Overdue", due:"Due now", scheduled:"Scheduled", upcoming:"Upcoming", done:"Done" };

function drawStudentCalendar(){
  const [y,mo]=state._scalMonth.split("-").map(Number);
  if($("scalLabel")) $("scalLabel").textContent=MONS[mo-1]+" "+y;
  const mStart=new Date(y,mo-1,1), mEnd=new Date(y,mo,0), dim=mEnd.getDate(), first=mStart.getDay();
  const todayS=todayIST();
  const byDay={}; (state._scalEvents||[]).forEach(e=>{ const s=parseD(String(e.event_date).slice(0,10)); const en=e.end_date?parseD(String(e.end_date).slice(0,10)):s; let d=new Date(Math.max(s,mStart)); const last=new Date(Math.min(en,mEnd)); for(;d<=last;d.setDate(d.getDate()+1)){ const day=d.getDate(); (byDay[day]=byDay[day]||[]).push(e); } });
  const sessByDay={}; (state._scalSess||[]).forEach(c=>{ const day=Number(String(c.session_date).slice(8,10)); (sessByDay[day]=sessByDay[day]||[]).push(c); });
  const bdayByDay={}; (state._scalBdays||[]).forEach(b=>{ (bdayByDay[b.day]=bdayByDay[b.day]||[]).push(b); });

    const clsChips=(sessByDay[d]||[]).sort((a,b)=>String(a.start_time||"").localeCompare(String(b.start_time||""))).map(c=>`<div class="calev" style="background:var(--saffron);color:#3a2c00;border-color:var(--saffron)" title="${esc(c.title)} · ${esc(teacherName(c.teacher_id))}${c.start_time?' · '+fmtTime(c.start_time.slice(0,5)):''}">${c.start_time?fmtTime(c.start_time.slice(0,5))+' · ':''}${esc(c.title)}</div>`).join("");
    const evs=(byDay[d]||[]).map(e=>`<div class="calev" title="${esc(e.title)}">${esc(e.title)}</div>`).join("");

    cells+=`<div class="calcell${ds===todayS?" today":""}"><div class="caldate">${d}</div>${clsChips}${bdays}${evs}</div>`;
  }
  const wdN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const joinRow=(title,sub,link)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)"><div><b>${esc(title)}</b><div class="mini" style="color:var(--muted)">${esc(sub)}</div></div><a class="kbtn teal" href="${esc(safeUrl(link))}" target="_blank" rel="noopener" style="text-decoration:none;flex:none">Join Zoom →</a></div>`;
  const recur=(state._scalBatch||[]).filter(b=>b.zoom_link);
  const recurHtml=recur.map(b=>joinRow(b.name, "Every "+(b.day_of_week!=null?wdN[b.day_of_week]:"week")+(b.start_time?" · "+fmtTime(String(b.start_time).slice(0,5)):"")+(b.mode==="hybrid"?" · hybrid":""), b.zoom_link)).join("");
  const online=(state._scalSess||[]).filter(c=>(c.mode==="online"||c.mode==="hybrid")&&c.zoom_link).sort((a,b)=>String((a.session_date||"")+(a.start_time||"")).localeCompare(String((b.session_date||"")+(b.start_time||""))));
  const datedHtml=online.map(c=>joinRow(c.title, String(c.session_date).slice(0,10)+(c.start_time?" · "+fmtTime(c.start_time.slice(0,5)):""), c.zoom_link)).join("");
  const onlineHtml=(recur.length||online.length)?`<div class="panel" style="margin-top:14px"><h3 style="margin:0 0 8px">🔴 Online classes — Join links</h3>${recurHtml}${datedHtml}</div>`:"";
  $("scalGrid").innerHTML=`<div class="calgrid">${wd}${cells}</div><div class="mini" style="margin-top:8px;color:var(--muted)"><span class="badge" style="background:var(--saffron);color:#3a2c00">your classes</span> <span class="badge b-teal">school events</span> <span class="badge" style="background:#FBEAF0;color:#993556">🎂 birthdays</span></div>${onlineHtml}`;
}

// Online convenience fee borne by the student (≈2.4%). Keep in sync with RAZORPAY_FEE_PCT on the server.
const GATEWAY_PCT=0.0236;
async function renderStudentFees(){
  const M=$("mainArea"); M.innerHTML=`<div class="empty">Loading…</div>`;
  if(!state._children){ await loadFamily(); }
  const fam=(state._children||[]);

  const kidIds=kids.map(k=>k.id);
  const { data:invs, error } = await db.from("invoices").select("id,student_id,period_label,amount,due_date,status,student_response,period_start,period_end,months,course_id").in("student_id",kidIds).order("due_date",{ascending:false});
  if(error){ M.innerHTML=`<div class="ph"><div><h2>Fees</h2></div></div><div class="cfgwarn">Couldn't load — ${esc(error.message)}</div>`; return; }
  const list=invs||[]; const todayS=todayIST();
  let cmap={}; try{ const { data:cs } = await db.from("courses").select("id,name"); (cs||[]).forEach(c=>cmap[c.id]=c.name); }catch(e){}
  const cnm=id=>id?(cmap[id]||"Course"):"";
  const kidOf=id=>kids.find(k=>k.id===id)||{};
  const kidName=id=>(kidOf(id).full_name)||"";
  const upiOf=id=>{ const k=kidOf(id); return k.upi_id||(k.branches&&k.branches.upi_id)||SCHOOL_UPI.id; };
  // paid ranges are per-student (one child's payment never covers another)
  const _ckey=i=>i.student_id+"|"+(i.course_id||"");
  const paidRangesBy={}; list.filter(i=>i.status==="paid"&&i.period_start&&i.period_end).forEach(i=>{ const k=_ckey(i); (paidRangesBy[k]=paidRangesBy[k]||[]).push([i.period_start,i.period_end]); });
  const coveredFee=i=>{ const ref=i.period_start||i.due_date; const rs=paidRangesBy[_ckey(i)]||[]; return ref && rs.some(r=>r[0]<=ref&&r[1]>=ref); };
  const dueInv=list.filter(i=>i.status!=="paid" && !coveredFee(i));
  const paidInv=list.filter(i=>i.status==="paid");
  const grandTotal=dueInv.reduce((a,i)=>a+Number(i.amount||0),0);

  // one bill card for a set of same-student, same-period invoices

    const ids=items.map(i=>i.id);

    const qr=`https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(upi)}`;
    const breakdown = items.length>1 ? `<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">${items.map(i=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span>${esc(cnm(i.course_id)||"Tuition")}</span><b>${INR(i.amount)}</b></div>`).join("")}</div>` : "";

function loadRazorpay(){ return new Promise((res,rej)=>{ if(window.Razorpay) return res(); const sc=document.createElement("script"); sc.src="https://checkout.razorpay.com/v1/checkout.js"; sc.onload=()=>res(); sc.onerror=()=>rej(new Error("Couldn't load the payment window. Check your internet and try again.")); document.head.appendChild(sc); }); }
async function payOnline(invoiceId, label){
  try{
    const { data:o, error } = await db.functions.invoke("razorpay-order",{ body:{ invoice_id:invoiceId } });
    if(error || !o || !o.ok){ alert("Couldn't start the payment — "+((o&&o.error)||(error&&error.message)||"please try again.")); return; }
    await loadRazorpay();
    const me=await myStudent();
    const rzp=new window.Razorpay({
      key:o.key_id, order_id:o.order_id, amount:o.amount, currency:o.currency||"INR",
      name:o.name||"Kala Kuteer", description:o.description||label||"Fees",
      prefill:{ name:(me&&me.full_name)||"" }, theme:{ color:"#7A2233" },
      handler:async function(resp){
        const { data:v, error:ve } = await db.functions.invoke("razorpay-verify",{ body:{ invoice_id:invoiceId, razorpay_order_id:resp.razorpay_order_id, razorpay_payment_id:resp.razorpay_payment_id, razorpay_signature:resp.razorpay_signature } });
        if(ve || !v || !v.ok){ alert("Payment received, but we couldn't confirm it automatically. Please contact the office with this reference: "+resp.razorpay_payment_id); return; }
        alert("✓ Payment successful! Your receipt is now available to download."); renderStudentFees();
      }
    });
    rzp.on("payment.failed", function(r){ alert("Payment failed — "+((r.error&&r.error.description)||"please try again.")); });
    rzp.open();
  }catch(e){ alert("Couldn't start the payment — "+(e.message||e)); }
}

async function submitFeedback(){

  const role=(state.role==="teacher")?"teacher":(state.role==="student"?"student":null);
  m.className="formmsg ok"; m.textContent="Sending…"; $("fbSubmit").disabled=true;
  const { error } = await db.from("suggestions").insert({ body, category:null, from_role:role });

async function waReceipt(invId){
  const { data:i, error } = await db.from("invoices").select("period_label,amount,student:students(full_name,whatsapp,phone,parent_phone),payments(method)").eq("id",invId).single();
  if(error||!i){ alert("Couldn't load — "+(error?.message||"")); return; }
  const num=((i.student?.whatsapp)||(i.student?.phone)||(i.student?.parent_phone)||"").replace(/\D/g,"");
  if(!num){ alert("No phone number on record for this student."); return; }
  const pay=(i.payments&&i.payments[0])||{};
  const amt="₹"+Number(i.amount||0).toLocaleString("en-IN");
  const txt=`*Kala Kuteer — Payment Receipt*\nName: ${i.student?.full_name||""}\nFee: ${i.period_label||""} — ${amt}\nPaid via ${pay.method||"-"}\nThank you! 🎶`;
  window.open("https://wa.me/"+num+"?text="+encodeURIComponent(txt),"_blank");
}

async function renderSignedForms(){
  const M=$("mainArea");
  M.innerHTML=`<div class="ph"><div><h2>Signed forms${tip("Every signed enrolment consent (students &amp; families) and Guru Code of Conduct, in one place. Click <b>View / print</b> to open the exact terms that person agreed to — with their name and the date &amp; time — then Print or Save as PDF. Keep this for any dispute, discrepancy or action.")}</h2><p>Legal record — the exact terms each student &amp; guru signed, ready to print</p></div></div>
    <div class="panel" style="margin-bottom:16px"><input id="sfSearch" class="inp" placeholder="🔍 Search by name…" oninput="drawSignedForms()" style="max-width:360px"></div>
    <div id="sfBody"><div class="empty">Loading signed records…</div></div>`;
  const [stu, tea] = await Promise.all([
    db.from("students").select("id,full_name,status,intake_completed,consent_signed_by,consent_signed_at,consent_text").order("full_name"),
    db.from("teachers").select("id,profile_id,coc_agreed,coc_signed_at,coc_signed_by,coc_text,profiles(full_name,email)").order("created_at",{ascending:false})
  ]);
  state._sfStudents = stu.data||[]; state._teachers = tea.data||[];
  drawSignedForms();
}
function drawSignedForms(){
  const box=$("sfBody"); if(!box) return;
  const q=(($("sfSearch")||{}).value||"").trim().toLowerCase();
  const allStu=state._sfStudents||[], allTea=state._teachers||[];
  const stus=allStu.filter(s=>!q||(s.full_name||"").toLowerCase().includes(q));
  const teas=allTea.filter(t=>!q||((t.profiles&&t.profiles.full_name)||"").toLowerCase().includes(q));
  const stuSigned=allStu.filter(s=>s.consent_signed_at||s.consent_text).length;
  const teaSigned=allTea.filter(t=>t.coc_agreed).length;
  const sBadge=s=>{
    if(s.consent_signed_at||s.consent_text){ const d=s.consent_signed_at?String(s.consent_signed_at).slice(0,10):""; const partial=s.consent_text?"":' <span class="mini" style="color:#a07b00">· date only</span>'; return `<span class="badge b-green">✓ signed${d?" · "+d:""}</span>${partial}`; }
    return `<span class="badge b-amber">not signed</span>`;

async function createStudentLogin(id){
  const m=$("manageMsg"); if(m){ m.className="formmsg ok"; m.textContent="Setting up login…"; }
  const { data:st } = await db.from("students").select("phone,parent_phone,date_of_birth,full_name").eq("id",id).maybeSingle();
  if(!st){ if(m){ m.className="formmsg err"; m.textContent="Couldn't load this student."; } return; }
  const phone=st.phone||st.parent_phone;
  if(!phone){ if(m){ m.className="formmsg err"; m.textContent="Add a mobile number first, then create the login."; } return; }
  let { data:fn, error:ferr } = await db.functions.invoke("create-student-login",{ body:{ student_id:id, phone, name:st.full_name } });
  if(ferr){ if(m){ m.className="formmsg err"; m.textContent="Couldn't create login — "+(await fnErr(ferr)); } return; }
  if(fn && fn.needs_confirmation){
    const ok=confirm("This mobile number already has a login for "+(fn.existing_name||"another student")+".\n\nAttach THIS student to that same family login? They'll share one login and see a combined bill.\n\nIf that is NOT the same family, click Cancel and use a different mobile number.");
    if(!ok){ if(m){ m.className="formmsg err"; m.textContent="Cancelled — use a different mobile number for this student, or link them later from the Family panel."; } return; }
    const res = await db.functions.invoke("create-student-login",{ body:{ student_id:id, phone, name:st.full_name, confirm:true } });
    fn=res.data; ferr=res.error;
    if(ferr){ if(m){ m.className="formmsg err"; m.textContent="Couldn't link — "+(await fnErr(ferr)); } return; }
  }
  if(fn && (fn.ok || fn.attached)){
    const pin=(fn&&fn.pin)||"";
    if(m){ m.className="formmsg ok"; m.textContent=fn.attached?"✓ Linked to the family's existing login (same mobile).":("✓ Login created. They sign in with their mobile + PIN "+pin+". Share this PIN with the family — they'll set their own on first login."); }
    renderStudentDetail(id);
  } else { if(m){ m.className="formmsg err"; m.textContent="Couldn't create login — "+((fn&&fn.error)||"unknown"); } }
}

async function linkFamily(id){

async function unlinkFamily(id){

}

async function editStudentCourse(studentId, scId){
  const { data:sc } = await db.from("student_courses").select("*").eq("id",scId).single();
  if(!sc) return;
  if($("sc_editId")) $("sc_editId").value=scId;
  if($("sc_course")) $("sc_course").value=sc.course_id||"";
  if($("sc_guru")) $("sc_guru").value=sc.teacher_id||"";
  if($("sc_fee")) $("sc_fee").value=sc.monthly_fee||"";
  if($("sc_status")) $("sc_status").value=sc.status||"active";
  if($("sc_level")) $("sc_level").value=sc.level||"Beginner";
  if($("scFormTitle")) $("scFormTitle").textContent="Edit course";
  if($("scCancel")) $("scCancel").style.display="inline-block";
  if($("sc_course")) $("sc_course").focus();
}
async function saveStudentCourse(studentId){
  const m=$("scMsg");
  const course_id=($("sc_course")&&$("sc_course").value)||null;
  const teacher_id=($("sc_guru")&&$("sc_guru").value)||null;
  const fee=($("sc_fee")&&$("sc_fee").value)?Number($("sc_fee").value):0;
  const status=($("sc_status")&&$("sc_status").value)||"active";
  const level=($("sc_level")&&$("sc_level").value)||"Beginner";
  if(!course_id) return failMsg(m,"Choose a course.");
  if(!teacher_id) return failMsg(m,"Choose a guru.");
  if(!(fee>0)) return failMsg(m,"Enter this course's monthly fee.");
  const rec={ student_id:studentId, course_id, teacher_id, monthly_fee:fee, status, level };
  m.className="formmsg ok"; m.textContent="Saving…";
  const editId=($("sc_editId")&&$("sc_editId").value)||"";
  let error;
  if(editId){ ({ error } = await db.from("student_courses").update(rec).eq("id",editId)); }
  else { ({ error } = await db.from("student_courses").insert(rec)); }
  if(error){
    const dup=(error.code==="23505")||/duplicate key/i.test(error.message||"");
    return failMsg(m, dup ? "This student already has that course. Pick a different course, or use Edit on the existing one." : ("Couldn't save — "+error.message));
  }
  await syncPrimaryCourse(studentId);
  renderStudentDetail(studentId);
}
async function syncPrimaryCourse(studentId){
  // keep the student's top-of-profile "primary" fields matching their first course
  try{
    const { data:list } = await db.from("student_courses").select("course_id,teacher_id,level,status,start_date").eq("student_id",studentId).order("start_date");
    if(!list||!list.length) return;
    const primary = list.find(c=>(c.status||"active")==="active") || list[0];
    await db.from("students").update({ course_id:primary.course_id, primary_teacher_id:primary.teacher_id, level:primary.level||"Beginner" }).eq("id",studentId);
  }catch(e){}
}
async function removeStudentCourse(studentId, scId){
  if(!confirm("Remove this course from the student? Their invoices already raised are not affected.")) return;
  const { error } = await db.from("student_courses").delete().eq("id",scId);
  if(error){ alert("Couldn't remove — "+error.message); return; }
  await syncPrimaryCourse(studentId);
  renderStudentDetail(studentId);
}

function splitPhoneCC(v){ v=String(v||"").trim(); if(!v) return {cc:"+91",num:""}; const codes=CC_OPTS.map(o=>o[0]).sort((a,b)=>b.length-a.length); for(const c of codes){ if(v.startsWith(c)) return {cc:c, num:v.slice(c.length).replace(/\D/g,"")}; } return {cc:"+91", num:v.replace(/\D/g,"")}; }
function ccSelectHTML(id,cc){ return `<select id="${id}" style="max-width:150px">`+CC_OPTS.map(o=>`<option value="${o[0]}"${o[0]===cc?" selected":""}>${o[1]}</option>`).join("")+`</select>`; }
function phoneOK(code,d){ const r=PHONE_RULES[code]||[7,15]; return d.length>=r[0]&&d.length<=r[1]; }
function phoneHint(code){ const r=PHONE_RULES[code]; return r?(r[0]===r[1]?r[0]+" digits":r[0]+"–"+r[1]+" digits"):"7–15 digits"; }
const DRAFT_KEY="kk_intake_draft_v2";
function saveDraft(){ const f=$("intakeForm"); if(!f) return; const o={}; f.querySelectorAll("input,select,textarea").forEach(el=>{ if(!el.id) return; o[el.id]=el.type==="checkbox"?el.checked:el.value; }); try{ localStorage.setItem(DRAFT_KEY,JSON.stringify(o)); }catch(e){} }
function restoreDraft(){ let o; try{ o=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); }catch(e){} if(!o) return false; let any=false; Object.keys(o).forEach(id=>{ const el=$(id); if(!el) return; if(el.type==="checkbox") el.checked=o[id]; else el.value=o[id]; if(o[id]!==""&&o[id]!==false) any=true; }); return any; }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
