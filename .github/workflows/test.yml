name: Safety checks (money logic + UI screens)

# Runs on every change to the app (including edits made on the GitHub website)
# and on pull requests. Green = the fee/date/payout logic still behaves AND every
# screen still renders without error in a headless DOM (backend stubbed — no live
# data touched). Red = something needs a look before going live.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Money logic + UI screen safety checks
        run: npm test
